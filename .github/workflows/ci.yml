name: CI

# Single CI workflow for the AgentGate repository.
#
# The Go module lives in agentgate/ (module path "agentgate"), per
# docs/PROJECT_DEFINITION.md §11's top-level layout — the repository root
# also holds docs/ and, in later phases, non-Go artifacts (gateway config,
# Cedar policies, migrations). Every Go step below runs with
# working-directory: agentgate and is gated on agentgate/go.mod existing,
# so this workflow degrades gracefully (green, with a notice) on any commit
# that predates the Go module and requires no further edits now that it
# exists.
#
# See docs/DEVELOPMENT/CI_BASELINE.md for the rationale and what is
# intentionally deferred to a later phase (Docker builds, SBOM, signing,
# deployment, integration containers).

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentgate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing below assumes the Go module exists. If a future commit
      # ever removes it, this step reports the skip and the job still ends
      # green — there is no code to validate, and CI must not fabricate a
      # fake module just to exercise itself.
      - name: Detect Go module
        id: gomod
        shell: bash
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No agentgate/go.mod present. Go validation steps are skipped (see docs/DEVELOPMENT/CI_BASELINE.md)."
          fi

      - name: Set up Go
        if: steps.gomod.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: agentgate/go.mod
          check-latest: true

      - name: Check formatting (gofmt)
        if: steps.gomod.outputs.exists == 'true'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: steps.gomod.outputs.exists == 'true'
        run: go vet ./...

      - name: go test (race-enabled)
        if: steps.gomod.outputs.exists == 'true'
        run: go test -race ./...

      - name: golangci-lint
        if: steps.gomod.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
          working-directory: agentgate

      # govulncheck has no pinned version in docs/TECH_STACK.md; it is run
      # via `go run` against its module path rather than installed from a
      # speculative release tag.
      - name: govulncheck
        if: steps.gomod.outputs.exists == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
