name: agentgate-g6

services:
  postgres:
    image: postgres:16-alpine
    container_name: g6-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate-dev-password
      POSTGRES_DB: agentgate_db
    volumes:
      - g6_pgdata:/var/lib/postgresql/data
      - ./init-g6-db.sql:/docker-entrypoint-initdb.d/01-init-g6-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate -d agentgate_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - g6net

  agentgate:
    build:
      context: ../..
      dockerfile: deploy/g6/Dockerfile.agentgate
    image: agentgate/agentgate:g6
    container_name: g6-agentgate
    ports:
      - "8090:8090"
      - "9001:9001"
    environment:
      AGENTGATE_HTTP_ADDR: ":8090"
      AGENTGATE_AUTHZ_GRPC_ADDR: ":9001"
      AGENTGATE_ENV: "development"
      AGENTGATE_LOG_LEVEL: "debug"
      AGENTGATE_ADMIN_TOKEN: "${AGENTGATE_ADMIN_TOKEN:-agentgate-admin-secret-dev}"
      AGENTGATE_AUDIT_SALT: "${AGENTGATE_AUDIT_SALT:-audit-salt-g6-dev-fixture}"
      AGENTGATE_DATABASE_URL: "${AGENTGATE_DATABASE_URL:-postgres://agentgate:agentgate-dev-password@postgres:5432/agentgate_db?sslmode=disable}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - g6net

  probe-mcp:
    build:
      context: ./probe-mcp
      dockerfile: Dockerfile
    image: agentgate/g6-probe-mcp:dev
    container_name: g6-probe-mcp
    ports:
      - "9100:9100"
      - "9101:9101"
    environment:
      G6_MCP_PORT: "9100"
      G6_COUNT_PORT: "9101"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9101/healthz"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    networks:
      - g6net

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.4.0@sha256:771afaf093065477fa296eb90dcb618a0300165f12a32f80bbdd1427fab900ec
    container_name: g6-agentgateway
    command: ["-f", "/etc/agentgateway/config.yaml"]
    volumes:
      - ./agentgateway.yaml:/etc/agentgateway/config.yaml:ro
    ports:
      - "3000:3000"
    depends_on:
      agentgate:
        condition: service_healthy
      probe-mcp:
        condition: service_healthy
    networks:
      - g6net

  probe-authz:
    build:
      context: ./probe-authz
      dockerfile: Dockerfile
    image: agentgate/g6-probe-authz:dev
    container_name: g6-probe-authz
    profiles: ["probe-only"]
    ports:
      - "9002:9002"
    environment:
      G6_AUTHZ_MODE: "allow"
      G6_AUTHZ_GRPC_PORT: "9001"
      G6_AUTHZ_HTTP_PORT: "9002"
    networks:
      - g6net

networks:
  g6net:
    name: g6net
    driver: bridge

volumes:
  g6_pgdata:
