# deploy/g5/docker-compose.yml — G5 Durable Audit Boundary Topology
#
# ARCHITECTURAL CONTEXT:
# Checkpoint G5 establishes an append-only, tamper-evident PostgreSQL audit boundary.
# Runtime user 'agentgate_app' cannot UPDATE or DELETE historical records.
# Real agentgateway/MCP proxying and enforcement remains Gate G6 / O-008.
#
# SECURITY & CREDENTIAL HANDLING NOTE:
# This topology is an integration test harness for local and CI validation.
# Sensitive values (AGENTGATE_ADMIN_TOKEN, AGENTGATE_DATABASE_URL, AGENTGATE_AUDIT_SALT)
# are injected from caller environment variables when set, with explicit non-secret
# development fallback fixtures (e.g. 'agentgate-admin-secret-dev') for isolated local runs.
# Production topologies must inject secrets via dedicated secret managers.
#
# Services:
#   [PostgreSQL 16] <--- [AgentGate Core (:8090)] <--- [QA Proof Probe / Audit Verifier]

services:
  postgres:
    image: postgres:16-alpine
    container_name: g5-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate-dev-password
      POSTGRES_DB: agentgate_db
    volumes:
      - g5_pgdata:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate -d agentgate_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - g5net

  agentgate:
    build:
      context: ../..
      dockerfile: deploy/g3/Dockerfile.agentgate
    image: agentgate/agentgate:g5
    container_name: g5-agentgate
    ports:
      - "8090:8090"
    environment:
      AGENTGATE_HTTP_ADDR: ":8090"
      AGENTGATE_ENV: "development"
      AGENTGATE_LOG_LEVEL: "debug"
      AGENTGATE_ADMIN_TOKEN: "${AGENTGATE_ADMIN_TOKEN:-agentgate-admin-secret-dev}"
      AGENTGATE_AUDIT_SALT: "${AGENTGATE_AUDIT_SALT:-audit-salt-g5-dev-fixture}"
      AGENTGATE_DATABASE_URL: "${AGENTGATE_DATABASE_URL:-postgres://agentgate:agentgate-dev-password@postgres:5432/agentgate_db?sslmode=disable}"
      AGENTGATE_RUNTIME_DATABASE_URL: "${AGENTGATE_RUNTIME_DATABASE_URL:-postgres://agentgate_app:agentgate-app-dev-password@postgres:5432/agentgate_db?sslmode=disable}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - g5net

  qa-probe:
    image: golang:1.24
    container_name: g5-qa-probe
    profiles: ["qa-manual"]
    working_dir: /src/agentgate
    volumes:
      - ../..:/src:ro
    environment:
      AGENTGATE_TEST_POSTGRES_URL: "${AGENTGATE_TEST_POSTGRES_URL:-postgres://agentgate:agentgate-dev-password@postgres:5432/agentgate_db?sslmode=disable}"
      AGENTGATE_BASE_URL: "${AGENTGATE_BASE_URL:-http://agentgate:8090}"
      AGENTGATE_ADMIN_TOKEN: "${AGENTGATE_ADMIN_TOKEN:-agentgate-admin-secret-dev}"
      AGENTGATE_AUDIT_SALT: "${AGENTGATE_AUDIT_SALT:-audit-salt-g5-dev-fixture}"
    command: ["go", "test", "-v", "./qa/g5audit/..."]
    depends_on:
      postgres:
        condition: service_healthy
      agentgate:
        condition: service_started
    networks:
      - g5net

networks:
  g5net:
    driver: bridge

volumes:
  g5_pgdata:
